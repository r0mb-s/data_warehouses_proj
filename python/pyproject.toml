[project]
name = "data-warehouse"
version = "0.1.0"
description = "Stock data warehouse ETL pipeline and API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cassandra-driver>=3.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "pyspark>=3.5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
serve = "app.main:start"
fill = "scripts.fill:main"
mcp-serve = "app.mcp_server:main"
assistant = "app.assistant:main"
spark-analytics = "scripts.spark_analytics:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
